# =============================================================================
# CẤU HÌNH ALEMBIC MIGRATION CHO AUTH SERVICE (alembic.ini)
# Nhiệm vụ: Quản lý tiến hóa lược đồ cơ sở dữ liệu độc lập cho `fruitstore_auth_db`
#           theo tiêu chuẩn NFR-M02 (có thể upgrade/downgrade độc lập).
# =============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://auth_user:CHANGE_ME_auth@localhost:5432/fruitstore_auth_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
