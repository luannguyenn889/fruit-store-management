<!--
  MODULE: Auth Reset Password View
  NHIỆM VỤ: Giao diện đặt lại mật khẩu mới từ liên kết Email (FR-A10)
-->
<div class="auth-page-container">
  <header class="auth-topbar">
    <div class="brand-identity">
      <div class="brand-logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
          <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
        </svg>
      </div>
      <div class="brand-title-wrap">
        <span class="brand-name">Fresh Orchard</span>
        <span class="brand-tagline">POS &amp; WHOLESALE OPS</span>
      </div>
    </div>
  </header>

  <main class="auth-card-wrapper">
    <div class="auth-card">
      <div class="card-leaf-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>

      <h1 class="card-title">Đặt lại mật khẩu mới</h1>
      <p class="card-subtitle">Nhập mật khẩu mới cho tài khoản Fresh Orchard của bạn</p>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="reset-new-password" class="form-label">Mật khẩu mới</label>
          <div class="input-with-icon">
            <span class="prefix-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input
              id="reset-new-password"
              [type]="showPassword ? 'text' : 'password'"
              name="newPassword"
              [(ngModel)]="newPassword"
              placeholder="Tối thiểu 6 ký tự"
              class="form-control"
              required
            />
            <button
              type="button"
              class="suffix-toggle-btn"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            >
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                <line x1="2" y1="2" x2="22" y2="22"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="reset-confirm-password" class="form-label">Xác nhận mật khẩu mới</label>
          <div class="input-with-icon">
            <span class="prefix-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
              </svg>
            </span>
            <input
              id="reset-confirm-password"
              [type]="showPassword ? 'text' : 'password'"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Nhập lại mật khẩu mới"
              class="form-control"
              required
            />
          </div>
        </div>

        <button type="submit" class="primary-submit-btn" [disabled]="isLoading()">
          <span *ngIf="!isLoading()">Xác nhận đổi mật khẩu</span>
          <span *ngIf="isLoading()">Đang xử lý...</span>
        </button>

        <div class="auth-switch-row" style="margin-top: 20px;">
          <a routerLink="/login" class="switch-link">Quay lại trang đăng nhập</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="auth-page-footer">
    <div class="footer-left">
      © 2024 Fresh Orchard Inc. Hệ thống quản trị kho &amp; bán lẻ nông sản sạch.
    </div>
    <div class="footer-right">
      <span class="version-tag">v2.4.8-vn</span>
    </div>
  </footer>
</div>
